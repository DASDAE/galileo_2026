[project]
name = "galileo-2026"
version = "0.1.0"
description = "Data and notebooks for the Galileo 2026 DASDAE tutorial."
readme = "readme.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    # The inventory, the SOR reader and the hive-style directory attributes
    # this tutorial uses are all on DASCore's dev branch and not in any
    # release yet. Swap this for a plain version specifier once the beta is
    # out -- and in every notebook's PEP 723 header too. Those headers
    # restate this list rather than inheriting it, because molab hands a
    # notebook nothing but its own file; keeping the two in step is manual.
    # AGENTS.md explains why it is that way.
    "dascore @ git+https://github.com/DASDAE/dascore@dev",
    "marimo>=0.24",
    "matplotlib>=3.10",
    "numba",
]

[project.optional-dependencies]
# Bonus material; not needed for notebooks 01-03.
bonus = [
    "dasjax==0.0.3",
    # The plain pins supply CPU JAX everywhere. Linux x86_64 -- molab's
    # platform, and the only one these wheels are built for -- also receives
    # the bundled CUDA runtime, a few gigabytes even on a CPU-only machine. It
    # is the CUDA 13 family, pinned package by package, because jaxlib probes
    # CUDA 13 before CUDA 12 and molab's image carries a jax-cuda13-plugin of
    # its own version that poisons a CUDA 12 plugin on the way past. AGENTS.md
    # explains it under "Environment".
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "jax-cuda13-plugin[with-cuda]==0.11.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax-cuda13-pjrt==0.11.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["galileo_2026"]

# The data rides inside the package so that installing this repository -- from
# its git URL, which is what every notebook header asks for -- brings the
# recordings with it. molab hands a notebook nothing but its own file, so data
# that sits beside the package rather than inside it never arrives.
[tool.setuptools.package-data]
galileo_2026 = ["data/**/*", "images/*.svg"]

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
# Linting is off for this repo; only the formatter runs. An empty `select`
# clears ruff's built-in defaults as well, so `ruff check` and any editor
# integration stay quiet instead of falling back to E4/E7/E9/F. The previous
# rule set, and the marimo-notebook exemptions that went with it, are in git
# history if they are ever wanted back.
select = []

[tool.ruff.format]
docstring-code-format = true
